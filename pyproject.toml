[project]
name = "sporty-group"
version = "0.1.0"
description = "HQA Assignment"
authors = [
    {name = "Vishal.Chillal"}
]
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "selenium (>=4.49.0,<5.0.0)",
    "allure-pytest (>=2.16.1,<3.0.0)",
    "assertpy (>=1.1,<2.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
